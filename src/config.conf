# ============================================================
#  三段式按键 → 小布记忆「一键闪记」
#  配置文件: /data/adb/tristate_xiaobu/config.conf
#  改完不需要重启: 下一次拨动开关时会自动重新加载
#  也可手动: sh /data/adb/modules/tristate_xiaobu/bin/cli.sh restart
# ============================================================

# ---------- 触发哪个档位 ----------
# 1 = 上档(静音)   2 = 中档(振动)   3 = 下档(响铃)
# 也接受 up / mid / down
TRIGGER_POSITION=1

# position : 一拨到该档位就触发(推荐)
# double   : 拨到该档位 -> 拨走 -> 在 DOUBLE_WINDOW 秒内再拨回来才触发(防误触)
TRIGGER_MODE=position
DOUBLE_WINDOW=3

# 同一档位的触发冷却时间(秒), 防止连拨重复触发
COOLDOWN=3

# 只在亮屏时触发(息屏时抓取屏幕内容没有意义)
SCREEN_ON_ONLY=1

# ---------- 触发什么动作 ----------
# flashnote  : 小布记忆「一键闪记」(默认, 等于三指上滑)
# command    : sh -c "$CUSTOM_COMMAND"
# intent     : am start $AM_EXTRA $INTENT_ARGS
# broadcast  : am broadcast $AM_EXTRA $INTENT_ARGS
# key        : input keyevent $KEYCODE
# none       : 只记日志, 不动作(用于先观察档位识别是否正确)
ACTION=flashnote

# 闪记的"触发来源", 决定小布记忆里记录的来源标识。
# 闪记 TriggerType 枚举:
#   1  = MAGIC_KEY            (闪记物理键)
#   2  = THREE_FINGERS_UP     (三指上滑, 默认, 与系统手势完全一致)
#   3  = CUI                  4  = SCREENSHOT
#   6  = SCREENSHOT_NORMAL    7  = SCREENSHOT_LONG
#   8  = SCREENSHOT_AREA
#   11 = AUTO_PAYMENT         12 = AUTO_COLLECT
#   14 = AUTO_PAYMENT_NOTIFICATION
#   15 = AI_KEY_DOUBLE_CLICK  17 = BREENO_TOUCH
FLASHNOTE_TRIGGER_TYPE=2

# ---------- ACTION 为 command/intent/broadcast/key 时使用 ----------
CUSTOM_COMMAND=
INTENT_ARGS=
KEYCODE=

# 附加给 am 的参数(一般留空; 多用户时可填 --user 0)
AM_EXTRA=

# ---------- 环境(一般不用改) ----------
# 档位真相节点: 1=上 2=中 3=下
TRI_STATE_NODE=/proc/tristatekey/tri_state

# 三段式按键的输入设备节点(用于零 CPU 阻塞等待拨动)
INPUT_DEVICE=/dev/input/event5

# 无事件时的等待上限(秒); 到点后顺便做健康检查与配置重载
EVENT_TIMEOUT=60

# tri_state 读不到时, 是否退回用铃声模式推断档位
# (能用, 但用其它方式改铃声也会误触发)
ALLOW_RINGER_FALLBACK=1

# 每次识别到档位变化都写日志(排查时用)
VERBOSE=1
